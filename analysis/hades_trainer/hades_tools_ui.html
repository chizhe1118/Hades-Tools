<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hades Tools</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e9edf2;background:#111417;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111417}header{height:58px;background:#191d21;border-bottom:1px solid #343b42;display:flex;align-items:center;padding:0 22px;gap:22px;position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0;color:#f2c063}#status{font-size:13px;color:#9fb1bd}main{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:#1a1f24;border:1px solid #363d44;border-radius:6px;padding:15px}.panel h2{font-size:15px;margin:0 0 13px;color:#d6dde3}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#121619;border:1px solid #30373d;padding:9px}.stat b{display:block;color:#f2c063;font-size:18px}.stat span{font-size:11px;color:#8f9da6}label{font-size:12px;color:#a8b3bb;display:block;margin:10px 0 5px}input,select{width:100%;height:34px;background:#111519;border:1px solid #3c454c;color:#edf1f4;padding:0 9px;border-radius:4px}button{height:34px;border:1px solid #59636b;background:#2a3238;color:#fff;border-radius:4px;padding:0 12px;cursor:pointer}button:hover{border-color:#e0ae50;background:#333b40}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tab.active{background:#9a6b21;border-color:#e0ae50}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid #353d43;padding:10px;background:#13181b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #30373d}th{color:#f2c063}.catalog{display:grid;grid-template-columns:220px 1fr;gap:10px}.list{height:430px;overflow:auto;border:1px solid #343c42}.item{padding:7px 9px;border-bottom:1px solid #2c3338;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.item:hover,.item.sel{background:#293139;color:#f2c063}#log{white-space:pre-wrap;height:140px;overflow:auto;font:11px Consolas;background:#0d1012;padding:8px;color:#9ec3a3}@media(max-width:800px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.catalog{grid-template-columns:1fr}.list{height:220px}}
</style></head><body><header><h1>HADES TOOLS</h1><span id="status">Connecting...</span><button onclick="refresh()">刷新</button></header><main><aside class="panel"><h2>运行状态</h2><div class="stats"><div class="stat"><b id="hp">-</b><span>生命</span></div><div class="stat"><b id="gold">-</b><span>金币</span></div><div class="stat"><b id="speed">-</b><span>速度</span></div><div class="stat"><b id="traits">-</b><span>祝福</span></div></div><label>生命</label><div class="row"><input id="health" type="number"><button onclick="num('health','health')">应用</button></div><label>最大生命</label><div class="row"><input id="maxHealth" type="number"><button onclick="num('max_health','maxHealth')">应用</button></div><label>金币</label><div class="row"><input id="money" type="number"><button onclick="num('money','money')">应用</button></div><label>重掷次数</label><div class="row"><input id="rerolls" type="number"><button onclick="num('rerolls','rerolls')">应用</button></div><label>速度</label><div class="row"><input id="speedValue" type="number" step="0.1"><button onclick="attr('Speed','speedValue')">应用</button></div><label>伤害倍率</label><div class="row"><input id="damage" type="number" step="0.1"><button onclick="attr('DamageOutputMultiplier','damage')">应用</button></div><label>暴击加成</label><div class="row"><input id="crit" type="number" step="1"><button onclick="attr('CritAddition','crit')">应用</button></div><div class="toggle"><span>无敌</span><input id="god" type="checkbox" onchange="send({action:'god',value:this.checked})" style="width:18px"></div></aside><section class="panel"><div class="tabs"><button class="tab active" onclick="tab('resources',this)">资源</button><button class="tab" onclick="tab('consumables',this)">道具</button><button class="tab" onclick="tab('traitsView',this)">祝福</button><button class="tab" onclick="tab('loot',this)">神祇奖励</button><button class="tab" onclick="tab('weapons',this)">武器</button></div><div id="resources" class="view active"><div class="catalog"><div id="resourceList" class="list"></div><div><label>资源数量</label><input id="resourceValue" type="number" value="999"><button style="margin-top:10px" onclick="selected&&send({action:'resource',name:selected.key,value:+resourceValue.value})">设置</button></div></div></div><div id="consumables" class="view"><div class="catalog"><div id="consumableList" class="list"></div><div><button onclick="spawn('spawn_consumable')">生成到玩家附近</button></div></div></div><div id="traitsView" class="view"><div class="catalog"><div id="traitList" class="list"></div><div><label>稀有度</label><select id="rarity"><option>Common</option><option>Rare</option><option>Epic</option><option>Heroic</option><option>Legendary</option></select><button style="margin-top:10px" onclick="spawn('add_trait',{rarity:rarity.value})">添加</button> <button onclick="spawn('remove_trait')">移除</button></div></div></div><div id="loot" class="view"><div class="catalog"><div id="lootList" class="list"></div><div><button onclick="spawn('spawn_loot')">生成奖励</button></div></div></div><div id="weapons" class="view"><div id="weaponList" class="grid"></div></div><h2 style="margin-top:18px">执行日志</h2><div id="log"></div></section></main><script>
let state,catalog,selected;const $=id=>document.getElementById(id);function out(x){$('log').textContent=new Date().toLocaleTimeString()+' '+(typeof x==='string'?x:JSON.stringify(x,null,2))+'\n'+$('log').textContent}async function send(cmd){$('status').textContent='Executing '+cmd.action;try{let r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cmd)}),j=await r.json();if(!r.ok)throw Error(j.error);if(cmd.action!=='catalog'&&cmd.action!=='diagnose'){state=j.value;render()}out(j);return j.value}catch(e){$('status').textContent='Error';out(e.message);throw e}}async function refresh(){await send({action:'snapshot'})}async function init(){catalog=await send({action:'catalog'});build();await refresh()}function render(){let h=state.hero;$('hp').textContent=h.health+'/'+h.maxHealth;$('gold').textContent=state.run.money;$('speed').textContent=Number(h.speed).toFixed(2);$('traits').textContent=h.traits.length;$('health').value=h.health;$('maxHealth').value=h.maxHealth;$('money').value=state.run.money;$('rerolls').value=state.run.rerolls;$('speedValue').value=h.speed;$('damage').value=h.damageMultiplier;$('crit').value=h.critAddition;$('god').checked=h.god;$('status').textContent='Connected · '+state.run.room+' · Player '+h.objectId}function fill(id,rows){let e=$(id);e.innerHTML='';rows.forEach(x=>{let d=document.createElement('div');d.className='item';d.textContent=x.key;d.title=x.name||x.description||x.key;d.onclick=()=>{document.querySelectorAll('.item').forEach(n=>n.classList.remove('sel'));d.classList.add('sel');selected=x};e.appendChild(d)})}function build(){fill('resourceList',catalog.resources);fill('consumableList',catalog.consumables);fill('traitList',catalog.traits);fill('lootList',catalog.loot);let heroes=['SwordWeapon','SpearWeapon','ShieldWeapon','BowWeapon','GunWeapon','FistWeapon'];$('weaponList').innerHTML=heroes.map(x=>`<button onclick="send({action:'weapon',name:'${x}'})">${x}</button>`).join('')}function num(a,id){send({action:a,value:+$(id).value})}function attr(n,id){send({action:'attribute',name:n,value:+$(id).value})}function spawn(a,extra={}){if(!selected)return out('先选择条目');send({action:a,name:selected.key,...extra})}function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}init();
</script></body></html>
