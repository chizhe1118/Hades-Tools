name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: Describe the workflow or limitation this should address.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Requested behavior
    validations:
      required: true
  - type: input
    id: game_build
    attributes:
      label: Hades build ID
      placeholder: 10929685
