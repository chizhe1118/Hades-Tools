name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native/requirements-build.txt

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v0.2.6') {
            throw "Tag $env:GITHUB_REF_NAME does not match the source version v0.2.6"
          }

      - name: Install build environment
        shell: pwsh
        run: |
          .\native\install-environment.ps1 `
            -Python python `
            -QtInstallRoot "$env:RUNNER_TEMP\Qt"

      - name: Build
        shell: pwsh
        run: |
          .\native\build.ps1 `
            -Python python `
            -QtRoot "$env:RUNNER_TEMP\Qt\6.8.3\mingw_64" `
            -MingwRoot "$env:RUNNER_TEMP\Qt\Tools\mingw1310_64"

      - name: Package
        shell: pwsh
        run: |
          .\native\package.ps1 `
            -Python python `
            -QtRoot "$env:RUNNER_TEMP\Qt\6.8.3\mingw_64" `
            -MingwRoot "$env:RUNNER_TEMP\Qt\Tools\mingw1310_64"
          .\native\package-single.ps1 `
            -MingwRoot "$env:RUNNER_TEMP\Qt\Tools\mingw1310_64"
          .\native\package-source.ps1
          Get-ChildItem native\dist\HadesTools-v0.2.6-* -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content native\dist\SHA256SUMS.txt -Encoding ASCII

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HadesTools-v0.2.6
          if-no-files-found: error
          path: |
            native/dist/HadesTools-v0.2.6-single.exe
            native/dist/HadesTools-v0.2.6-win64.zip
            native/dist/HadesTools-v0.2.6-source.zip
            native/dist/*.sha256
            native/dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            native/dist/HadesTools-v0.2.6-single.exe
            native/dist/HadesTools-v0.2.6-win64.zip
            native/dist/HadesTools-v0.2.6-source.zip
            native/dist/*.sha256
            native/dist/SHA256SUMS.txt
